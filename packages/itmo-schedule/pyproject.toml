[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "itmo-schedule"
version = "0.1.0"
description = "A Python library for fetching personal ITMO schedules."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.28,<1", "tzdata>=2025.1"]

[tool.hatch.build.targets.wheel]
packages = ["itmo_schedule"]
