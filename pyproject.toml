[project]
name = "itmosync"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kirill Volychev", email = "volychevk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "icalendar>=7.3.0",
    "itmo-schedule",
    "jinja2>=3.1.6",
    "pydantic-settings[yaml]>=2.15.0",
]

[project.scripts]
itmosync = "itmosync:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.uv.workspace]
members = [
    "packages/itmo-schedule",
]

[tool.uv.sources]
itmo-schedule = { workspace = true, editable = true }
