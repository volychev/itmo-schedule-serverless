name: Sync & Deploy ITMO Schedule

on:
  push:
    branches:
      - main

  schedule:
    - cron: '17 3,9,15,20 * * *'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Inject GitHub Variables into Environment
        run: |
          echo '${{ toJson(vars) }}' | jq -r 'to_entries[] | select(.value != "") | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - name: Generate calendars
        env:
          ITMO_SYNC_USERNAME: ${{ secrets.ITMO_SYNC_USERNAME }}
          ITMO_SYNC_PASSWORD: ${{ secrets.ITMO_SYNC_PASSWORD }}
          ITMO_SYNC_URL_HASH: ${{ secrets.ITMO_SYNC_URL_HASH }}
        run: uv run python src/itmo_sync/main.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
